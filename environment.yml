name: infodrp
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9.18
  - numpy=1.24.3
  - pandas=1.5.3
  - scipy=1.11.2
  - scikit-learn=1.3.0
  - tqdm=4.66.1

  # PyTorch + CUDA
  - pytorch=1.13.1
